<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Registrieren – Saniga Zeiterfassung</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --saniga-red: #12B8E1;
  --saniga-red-l: #45cae9;
  --bg: #eef5f8;
  --border: rgba(22,48,58,0.09);
  --t1: #152830;
  --t2: #4a6570;
  --t3: #7d939c;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--t1); min-height: 100vh; padding: 24px; font-size: 14px; }
.wrap { max-width: 440px; margin: 0 auto; padding-top: 8vh; }
.card {
  background: white; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px; box-shadow: 0 8px 32px rgba(26,35,50,.08);
}
h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
p.sub { color: var(--t3); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
.fg { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
label { font-size: 11.5px; font-weight: 600; color: var(--t2); }
input, select {
  border: 1.5px solid rgba(26,35,50,0.16); border-radius: 9px; padding: 10px 12px;
  font-size: 14px; font-family: inherit; width: 100%;
}
input:focus, select:focus { outline: none; border-color: var(--saniga-red); box-shadow: 0 0 0 3px rgba(18,184,225,.15); }
input[readonly] { background: #f3f7f9; color: var(--t2); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 9px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; font-family: inherit; width: 100%; margin-top: 6px;
  background: linear-gradient(135deg, var(--saniga-red), var(--saniga-red-l)); color: white;
}
.btn:hover { opacity: 0.95; }
.err { color: #dc2626; font-size: 13px; margin-top: 12px; display: none; }
.back { text-align: center; margin-top: 18px; }
.back a { color: var(--saniga-red); font-weight: 600; text-decoration: none; font-size: 13px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Token-based invitation accept -->
  <div class="card hidden" id="panelToken">
    <h1>Passwort festlegen</h1>
    <p class="sub">Sie wurden eingeladen. Legen Sie ein Passwort fest, um Ihr Konto zu aktivieren.</p>
    <div class="row2">
      <div class="fg" style="margin-bottom:14px;">
        <label>Vorname</label>
        <input type="text" id="tokFirst" readonly>
      </div>
      <div class="fg" style="margin-bottom:14px;">
        <label>Nachname</label>
        <input type="text" id="tokLast" readonly>
      </div>
    </div>
    <div class="fg">
      <label>E-Mail</label>
      <input type="email" id="tokEmail" readonly>
    </div>
    <div class="fg">
      <label>Passwort (mind. 8 Zeichen)</label>
      <input type="password" id="tokPass" autocomplete="new-password" placeholder="••••••••">
    </div>
    <div class="fg">
      <label>Passwort wiederholen</label>
      <input type="password" id="tokPass2" autocomplete="new-password" placeholder="••••••••">
    </div>
    <button type="button" class="btn" id="tokBtn">Konto aktivieren</button>
    <p class="err" id="tokErr"></p>
    <div class="back"><a href="/">Zurück zur Anmeldung</a></div>
  </div>

  <!-- Shared invite-code registration (legacy) -->
  <div class="card" id="panelCode">
    <h1>Konto erstellen</h1>
    <p class="sub">Geben Sie den Einladungscode ein, den Sie von der Geschäftsleitung erhalten haben. Anschliessend können Sie Ihre Arbeitszeiten erfassen.</p>
    <div class="fg">
      <label>Einladungscode</label>
      <input type="text" id="inviteCode" autocomplete="off" placeholder="z.B. SANIGA-2026">
    </div>
    <div class="fg">
      <label>E-Mail (für Login)</label>
      <input type="email" id="email" autocomplete="username" placeholder="name@firma.ch">
    </div>
    <div class="fg">
      <label>Passwort (mind. 8 Zeichen)</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="••••••••">
    </div>
    <div class="row2">
      <div class="fg" style="margin-bottom:0;">
        <label>Vorname</label>
        <input type="text" id="firstName" placeholder="Vorname">
      </div>
      <div class="fg" style="margin-bottom:0;">
        <label>Nachname</label>
        <input type="text" id="lastName" placeholder="Nachname">
      </div>
    </div>
    <div class="fg">
      <label>Funktion</label>
      <select id="jobTitle">
        <option>Monteur Sanitär</option>
        <option>Monteur Heizung</option>
        <option>Monteur Lüftung</option>
        <option>Lehrling</option>
        <option>Mitarbeiter</option>
      </select>
    </div>
    <button type="button" class="btn" id="regBtn">Registrieren &amp; anmelden</button>
    <p class="err" id="err"></p>
    <div class="back"><a href="/">Zurück zur Anmeldung</a></div>
  </div>
</div>
<script>
const TOKEN_KEY = 'saniga_token';
const params = new URLSearchParams(window.location.search);
const inviteToken = params.get('token');

function showErr(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  if (msg) {
    el.textContent = msg;
    el.style.display = 'block';
  } else {
    el.textContent = '';
    el.style.display = 'none';
  }
}

async function initTokenFlow() {
  document.getElementById('panelCode').classList.add('hidden');
  document.getElementById('panelToken').classList.remove('hidden');
  try {
    const r = await fetch('/api/invitations/' + encodeURIComponent(inviteToken));
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Einladung ungültig');
    document.getElementById('tokFirst').value = data.invitation.firstName || '';
    document.getElementById('tokLast').value = data.invitation.lastName || '';
    document.getElementById('tokEmail').value = data.invitation.email || '';
  } catch (e) {
    showErr('tokErr', e.message);
    document.getElementById('tokBtn').disabled = true;
  }
}

document.getElementById('tokBtn').addEventListener('click', async () => {
  showErr('tokErr', '');
  const password = document.getElementById('tokPass').value;
  const password2 = document.getElementById('tokPass2').value;
  if (password.length < 8) {
    showErr('tokErr', 'Passwort mindestens 8 Zeichen.');
    return;
  }
  if (password !== password2) {
    showErr('tokErr', 'Passwörter stimmen nicht überein.');
    return;
  }
  try {
    const r = await fetch('/api/invitations/' + encodeURIComponent(inviteToken) + '/accept', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Aktivierung fehlgeschlagen');
    localStorage.setItem(TOKEN_KEY, data.token);
    window.location.href = '/';
  } catch (e) {
    showErr('tokErr', e.message);
  }
});

document.getElementById('regBtn').addEventListener('click', async () => {
  showErr('err', '');
  const body = {
    inviteCode: document.getElementById('inviteCode').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    jobTitle: document.getElementById('jobTitle').value,
  };
  try {
    const r = await fetch('/api/auth/register-employee', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Registrierung fehlgeschlagen');
    localStorage.setItem(TOKEN_KEY, data.token);
    window.location.href = '/';
  } catch (e) {
    showErr('err', e.message);
  }
});

if (inviteToken) {
  initTokenFlow();
}
</script>
</body>
</html>
