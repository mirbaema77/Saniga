<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#12B8E1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Saniga"/>
<title>Registrieren – Saniga Zeiterfassung</title>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/assets/logo-saniga.png"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --saniga-red: #12B8E1;
  --saniga-red-l: #45cae9;
  --bg: #eef5f8;
  --border: rgba(22,48,58,0.09);
  --t1: #152830;
  --t2: #4a6570;
  --t3: #7d939c;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--t1); min-height: 100vh; padding: 24px; font-size: 14px; }
.wrap { max-width: 440px; margin: 0 auto; padding-top: 8vh; }
.card {
  background: white; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px; box-shadow: 0 8px 32px rgba(26,35,50,.08);
}
h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
p.sub { color: var(--t3); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
.fg { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
label { font-size: 11.5px; font-weight: 600; color: var(--t2); }
input {
  border: 1.5px solid rgba(26,35,50,0.16); border-radius: 9px; padding: 10px 12px;
  font-size: 14px; font-family: inherit; width: 100%;
}
input:focus { outline: none; border-color: var(--saniga-red); box-shadow: 0 0 0 3px rgba(18,184,225,.15); }
input[readonly] { background: #f3f7f9; color: var(--t2); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 9px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; font-family: inherit; width: 100%; margin-top: 6px;
  background: linear-gradient(135deg, var(--saniga-red), var(--saniga-red-l)); color: white;
}
.btn:hover { opacity: 0.95; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.err { color: #dc2626; font-size: 13px; margin-top: 12px; display: none; }
.back { text-align: center; margin-top: 18px; }
.back a { color: var(--saniga-red); font-weight: 600; text-decoration: none; font-size: 13px; }
.hidden { display: none !important; }
@media (max-width: 767px) {
  body { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; max-width: 100vw; }
  .wrap { padding-top: 4vh; max-width: 100%; }
  .card { padding: 22px 18px; }
  input, .btn { min-height: 48px; font-size: 16px; }
  .btn { width: 100%; }
  .row2 { grid-template-columns: 1fr; }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 10px 8px; font-size: 15px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card hidden" id="panelToken">
    <h1>Passwort festlegen</h1>
    <p class="sub">Sie wurden eingeladen. Legen Sie ein Passwort fest, um Ihr Konto zu aktivieren.</p>
    <div class="row2">
      <div class="fg" style="margin-bottom:14px;">
        <label>Vorname</label>
        <input type="text" id="tokFirst" readonly>
      </div>
      <div class="fg" style="margin-bottom:14px;">
        <label>Nachname</label>
        <input type="text" id="tokLast" readonly>
      </div>
    </div>
    <div class="fg">
      <label>E-Mail</label>
      <input type="email" id="tokEmail" readonly>
    </div>
    <div class="fg">
      <label>Passwort (mind. 8 Zeichen)</label>
      <input type="password" id="tokPass" autocomplete="new-password" placeholder="••••••••">
    </div>
    <div class="fg">
      <label>Passwort wiederholen</label>
      <input type="password" id="tokPass2" autocomplete="new-password" placeholder="••••••••">
    </div>
    <button type="button" class="btn" id="tokBtn">Konto aktivieren</button>
    <p class="err" id="tokErr"></p>
    <div class="back"><a href="/">Zurück zur Anmeldung</a></div>
  </div>

  <div class="card hidden" id="panelMissing">
    <h1>Einladung erforderlich</h1>
    <p class="sub">Die Registrierung ist nur über einen persönlichen Einladungslink möglich. Bitte wenden Sie sich an die Geschäftsleitung.</p>
    <div class="back"><a href="/">Zurück zur Anmeldung</a></div>
  </div>
</div>
<script>
const TOKEN_KEY = 'saniga_token';
const params = new URLSearchParams(window.location.search);
const inviteToken = params.get('token');

function showErr(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  if (msg) {
    el.textContent = msg;
    el.style.display = 'block';
  } else {
    el.textContent = '';
    el.style.display = 'none';
  }
}

async function initTokenFlow() {
  document.getElementById('panelToken').classList.remove('hidden');
  try {
    const r = await fetch('/api/invitations/' + encodeURIComponent(inviteToken));
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Einladung ungültig');
    document.getElementById('tokFirst').value = data.invitation.firstName || '';
    document.getElementById('tokLast').value = data.invitation.lastName || '';
    document.getElementById('tokEmail').value = data.invitation.email || '';
  } catch (e) {
    showErr('tokErr', e.message);
    document.getElementById('tokBtn').disabled = true;
  }
}

document.getElementById('tokBtn').addEventListener('click', async () => {
  showErr('tokErr', '');
  const password = document.getElementById('tokPass').value;
  const password2 = document.getElementById('tokPass2').value;
  if (password.length < 8) {
    showErr('tokErr', 'Passwort mindestens 8 Zeichen.');
    return;
  }
  if (password !== password2) {
    showErr('tokErr', 'Passwörter stimmen nicht überein.');
    return;
  }
  try {
    const r = await fetch('/api/invitations/' + encodeURIComponent(inviteToken) + '/accept', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Aktivierung fehlgeschlagen');
    localStorage.setItem(TOKEN_KEY, data.token);
    window.location.href = '/';
  } catch (e) {
    showErr('tokErr', e.message);
  }
});

if (inviteToken) {
  initTokenFlow();
} else {
  document.getElementById('panelMissing').classList.remove('hidden');
}
</script>
</body>
</html>
